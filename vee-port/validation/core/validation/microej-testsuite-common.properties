# ArrayCopyPerformance thresholds. The README covers the benchmark and the options.
#
# Baseline on the MIMXRT1170-EVKB, release mode, default 64 KB buffers, six runs: aligned 131 MB/s,
# misaligned 87 MB/s, overlap left 131 MB/s in every run; overlap right 87 MB/s in two runs and
# 131 MB/s in four. Each threshold is the lowest value observed, minus 10%. Overlap right takes the
# 87 MB/s case because it follows the heap layout: the test allocates its two buffers first, so a new
# application property shifts their base address, and only the backwards copy is sensitive to that.
#
# The figures come from this configuration. The Java heap is in the external SDRAM, mapped
# write-through with no write allocate (MPU region 9 in board.c, CACHE_MODE_WRITE_THROUGH=1 in
# flags.cmake), so each copied byte costs one read and one write. The copy runs on the full newlib
# memmove, overridden in fast_memmove.c. xmcd_data[] sets a 32-bit SEMC port at 198 MHz
# (XIP_BOOT_HEADER_XMCD_ENABLE=1 in flags.cmake), so the SDRAM peak is 792 MB/s: the aligned
# 131 MB/s is 262 MB/s on the bus, about a third of that.
#
# Re-measure the baseline after any change to the cache policy, the SEMC clock, the libc, or the
# memmove override.
#microej.java.property.com.microej.core.tests.arraycopy.buffer.size.bytes=65536
microej.java.property.com.microej.core.tests.arraycopy.min.throughput.mbps=118
microej.java.property.com.microej.core.tests.arraycopy.min.throughput.misaligned.mbps=78
microej.java.property.com.microej.core.tests.arraycopy.min.throughput.overlap.right.mbps=78
microej.java.property.com.microej.core.tests.arraycopy.min.throughput.overlap.left.mbps=118
